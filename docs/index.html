<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>船橋市 防災情報</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app" class="state-normal">
    <header class="topbar">
      <div class="title">防災情報</div>
      <div class="area">千葉県船橋市</div>
    </header>

    <section id="normalView" class="view">
      <div class="normal-mark">✓</div>
      <h1>現在、緊急情報はありません</h1>
      <p>最新の防災情報を自動確認しています。</p>
    </section>

    <section id="alertView" class="view hidden">
      <div id="severityBadge" class="severity-badge">警報</div>
      <h1 id="alertTitle">防災情報</h1>
      <p id="alertMessage"></p>
      <div id="alertList" class="alert-list"></div>
    </section>

    <section id="errorView" class="view hidden">
      <div class="error-mark">!</div>
      <h1>防災情報を確認できません</h1>
      <p>通信または情報提供元の状態を確認しています。</p>
      <p class="small">「情報なし」とは判定していません。</p>
    </section>

    <footer class="footer">
      <span id="status">初回確認中…</span>
      <span id="clock"></span>
    </footer>

    <div id="demoBadge" class="demo-badge hidden">DEMO</div>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
